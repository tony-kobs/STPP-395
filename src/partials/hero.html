<section class="hero" id="hero" data-hero>
  <div class="container">
    <div class="hero__media">
      <picture>
        <source
          media="(min-width: 1440px)"
          srcset="./img/hero-1x.jpg 1x, ./img/hero-2x.jpg 2x"
        />
        <img
          class="hero__bg"
          data-hero-anim="bg"
          src="./img/hero-mobile-1x.jpg"
          srcset="./img/hero-mobile-1x.jpg 1x, ./img/hero-mobile-2x.jpg 2x"
          alt=""
          width="543"
          height="360"
          fetchpriority="high"
          decoding="async"
        />
      </picture>

      <div class="hero__content">
        <p class="hero__eyebrow" data-hero-anim="eyebrow">Hexa Diamonds</p>
        <h1 class="hero__title">
          <span
            class="hero__title-line hero__title-line--purple"
            data-hero-anim="title-purple"
            >Think Sharp.</span
          >
          <span
            class="hero__title-line hero__title-line--pink"
            data-hero-anim="title-pink"
            >Shine Bright.</span
          >
        </h1>
        <p class="hero__text" data-hero-anim="text">
          Relaxing hexagon puzzles powered by magical diamonds. Every piece
          fits. Every puzzle shines.
        </p>
        <span data-hero-anim="cta">
          <load src="partials/google-play.html" class="pulse-btn" />
        </span>
      </div>
    </div>

    <div class="hero__cat" data-hero-anim="cat">
      <picture>
        <source media="(min-width: 1440px)" srcset="./img/decor/hero-cat.png" />
        <img
          class="hero__cat-img"
          data-hero-anim="cat-img"
          src="./img/decor/hero-cat-mobile.png"
          alt=""
          width="163"
          height="181"
          loading="eager"
          decoding="async"
        />
      </picture>
    </div>

    <div class="hero__edge">
      <picture>
        <source
          media="(min-width: 1440px)"
          srcset="./img/decor/mountain-bgd-hero.png"
        />
        <img
          class="hero__edge-img"
          data-hero-anim="edge"
          src="./img/decor/mountain-bgd-hero.png"
          alt=""
          width="459"
          height="170"
          loading="eager"
          decoding="async"
        />
      </picture>
    </div>
  </div>
</section>
